<script>
const S={pattern:'multi',view:'moth',n:5,d:1,mwhere:'onprem',ingest:'small',avail:'ha',search:'shc',es:true,virt:false,hf:false,edC:'ess',edD:'ess',soar:false,csoar:false,csize:'single'};

['view','2. SOC single view',[['moth','Mothership App for Splunk'],['itsm','ITSM tool (e.g. ServiceNow)'],['both','Both: Mothership to investigate, ITSM for tickets']]],

['edC','3. MSP platform: Enterprise Security edition',[['ess','ES Essentials'],['prem','ES Premier (includes Splunk SOAR)']]],['soar','Standalone Splunk SOAR for the SOC','c'],['edD','Dedicated client stacks: Enterprise Security edition',[['ess','ES Essentials'],['prem','ES Premier (includes Splunk SOAR)']]],['csoar','Standalone Splunk SOAR in each dedicated stack','c'],['mwhere','4. MSP shared platform: hosting',WH],

['avail','Availability',[['none','No HA: temporary gaps acceptable'],['ha','HA: results must stay complete (indexer cluster)'],['dr','Automatic recovery from a site outage (multi-site)']]],
['search','Search tier',[['one','Single search head'],['shc','Search head cluster'],['stretch','Stretched SHC across sites']]],
['virt','MSP platform on virtualised hosts','c'],['hf','Heavy forwarder tier in front of the shared platform','c'],

const fm=document.getElementById('f');
fm.innerHTML=G.map(([k,l,o])=>{let b;

 if(t.type==='checkbox')S[t.name]=t.checked;else if(t.type==='number')S[t.name]=Math.max(1,Math.min(30,+t.value||1));else S[t.name]=t.value;go()}));

function code(z){if(z.mwhere==='saas')return 'Splunk Cloud';
 const i=z.avail==='dr'?'M':z.avail==='ha'?'C':'D';
 if(i==='S')return 'S1';

function go(){const z={...S};z.n=Math.max(2,z.n);

 const v={d:hy,edC:hasS,soar:!hasS||z.edC==='ess',edD:hasD,csoar:hasD&&z.edD==='ess',hf:hasS,mwhere:hasS,ingest:hasS&&!sa,avail:hasS&&!sa,search:hasS&&!sa,virt:hasS&&!sa,csize:hasD};
 G.forEach(([k])=>{document.getElementById('fs-'+k).hidden=k in v&&!v[k]});

 const C=hasS?code(z):null;draw(z,C);CUR={z,C};notes(z,C);STEPS=steps(z,C);trace();save()}

function draw(z,C){
 const W=980,P=14,E=[],hasS=!!C,hasD=z.pattern!=='multi',hy=z.pattern[0]==='h',H=(z.sC||z.sD)?222:190;

 const y1=76,y2=y1+54+46,y3=y2+H+(z.hf&&hasS?80:46);
 box((W-200)/2,8,200,40,'src','MSP SOC analyst','',0,'analyst');bd(7,(W-200)/2+190,14);if(!hasS&&z.sC){box(W-P-250,8,250,40,'ten','Splunk SOAR: SOC automation','',0,'soar');bd(5,W-P-10,12);arrow(594,22,W-P-254,22);arrow(W-P-254,34,594,34)}

 if(z.view==='both'){vw=hy?380:460;mx=P;ix=P+vw+30;box(mx,y1,vw,54,'sh',...mo,0,'moth');box(ix,y1,vw,54,'ten',...it,0,'itsm');arrow(mx+vw+3,y1+20,ix-3,y1+20);arrow(ix-3,y1+36,mx+vw+3,y1+36);arrow(W/2,48,mx+vw/2,y1);arrow(W/2,48,ix+vw/2,y1)}
 else{vw=560;mx=ix=(W-vw)/2;z.view==='moth'?box(mx,y1,vw,54,'sh',...mo,0,'moth'):box(ix,y1,vw,54,'ten',...it,0,'itsm');arrow(W/2,48,W/2,y1)}
 if(z.view!=='moth')bd(4,ix+vw-14,y1+12);
 const tx=z.view==='itsm'?ix:mx,up=cx=>{const x2=Math.max(tx+30,Math.min(tx+vw-30,cx));arrow(cx,y2,x2,y1+54);lab((cx+x2)/2+6,(y2+y1+54)/2+4,z.view==='itsm'?'alerts pushed as tickets':'scheduled pull');bd(3,(cx+x2)/2-16,(y2+y1+54)/2)};
 const items=(cnt,cap,off)=>Array.from({length:Math.min(cnt,cap)},(_,i)=>i===cap-1&&cnt>cap?{more:cnt-cap+1}:{i:off+i+1});
 const envb=(x,w,t)=>{box(x,y3,w,50,'src',t.more?'More clients':`C${t.i} environment`,'Forwarders, infra, users',0,'env')};
 const dw=hasS?380:W-2*P,sx=hasD?P+396:P,sw=hasD?556:W-2*P;
 if(hasD){const it2=hasS?[{i:1},{more:1}]:[{i:1},{i:2},{i:3},{more:1}],cw=(dw-(it2.length-1)*12)/it2.length,sc=z.csize==='single'?'S1':z.es?'C11':'C1';
  it2.forEach((t,j)=>{const x=P+j*(cw+12),cx=x+cw/2;
   if(t.more)box(x,y2,cw,H,'ctn','More dedicated stacks','One per large client',1);
   else{box(x,y2,cw,H,'ctn','','',1);lab(x+10,y2+20,`C${t.i} stack · ${sc}`);box(x+10,y2+34,cw-20,50,'sh','ES '+(z.edD==='prem'?'Premier':'Essentials'),'Search and detection',0,'es');if(z.sD){box(x+10,y2+90,cw-20,40,'ten','Splunk SOAR',z.edD==='prem'?'Included in Premier':'Standalone, paired',0,'csoar');if(!j)bd(5,x+cw-22,y2+92)};box(x+10,z.sD?y2+136:y2+100,cw-20,54,'idx',z.csize==='single'?'Single instance':'Indexer cluster',z.csize==='single'?'Index and license':'3+ peers, RF3 / SF2',0,'idx')}
   up(cx);envb(x,cw,t);arrow(cx,y3,cx,y2+H);if(!j){lab(cx+6,y3-18,'logs via forwarders');bd(1,cx-24,y3-14)}})}
 if(hasS){const iy=z.sC?y2+136:y2+100,sa=z.mwhere==='saas',idx=C[0],dg=sa?3:(+C.slice(1))%10,x=sx,w=sw;
  box(x,y2,w,H,'ctn','','',1);bd(2,x+w-16,y2+14);
  lab(x+12,y2+20,`MSP shared platform · ${sa?'Splunk Cloud Platform':C+' · '+(z.mwhere==='cloud'?'public cloud':'on-prem')}${z.virt&&!sa?' (VMs)':''}`);
  const sr=[];
  if(sa)sr.push(['ES search heads','Managed by Splunk','sh','es']);
  else if(idx==='S')sr.push(['Search and ES','On the single instance','sh','es']);
  else if(z.es){sr.push(['ES search heads',dg===4?'SHC ×3, stretched':dg===3?'SHC ×3 + deployer':dg===2?'×2, one per site':'×1, ES only','sh','es']);sr.push(['Analyst search heads','Ad hoc and dashboards','sh'])}
  else sr.push(['Search heads',dg>=3?'SHC ×3 + deployer':dg===2?'×2, one per site':'×1','sh','es']);
  if(z.pattern==='hdash')sr.push(['Client dashboards','Read-only, no search','ten']);
  if(z.pattern==='hsearch')sr.push(['Client search heads','RBAC, own indexes only','ten']);
  const bw=(w-24-(sr.length-1)*10)/sr.length;
  sr.forEach((s,j)=>box(x+12+j*(bw+10),y2+34,bw,50,s[2],s[0],s[1],0,s[3]));
  if(hy){const ux=W-P-130,acx=x+12+(sr.length-1)*(bw+10)+bw/2;box(ux,y1,130,54,'src','Client users',z.pattern==='hdash'?'Dashboards only':'RBAC-limited search',0,'users');bd(6,ux+118,y1+12);arrow(ux+65,y1+54,acx,y2+34);lab((ux+65+acx)/2+6,(y1+54+y2+34)/2+4,z.pattern==='hdash'?'dashboards':'search access')}
  if(z.sC)box(x+12,y2+90,w-24,40,'ten','Splunk SOAR',z.edC==='prem'?'Included with ES Premier: automates SOC response':'Standalone: automates SOC response, paired with ES',0,'soar');if(z.sC)bd(5,x+w-26,y2+92);
  const ix2={S:['Single instance: S1','Index and license on one host'],D:['Indexers ×2+','Non-clustered, no replication'],C:['Indexer cluster ×3+','Replication factor 3, search factor 2'],M:['Multi-site indexer cluster','2+ sites, site-aware replication']};
  box(x+12,iy,w-24,54,'idx',...(sa?['Indexers (managed)','Splunk operates indexing']:ix2[idx]),0,'idx');
  arrow(x+w/2,iy,x+w/2,iy-(z.sC?6:16));
  lab(x+12,y2+H-12,sa?'Customer side: heavy forwarders, Deployment Server':'Mgmt: '+[idx==='C'||idx==='M'?'Cluster Mgr':'','License Mgr','Deployment Server','Monitoring Console',dg>=3?'SHC Deployer':''].filter(Boolean).join(', '));
  const b0=hasD?2:1,it3=[{i:b0},{i:b0+1},{i:b0+2},{more:1}],ew=(sw-(it3.length-1)*12)/it3.length;
  it3.forEach((t,j)=>{const ex=sx+j*(ew+12);envb(ex,ew,t);arrow(ex+ew/2,y3,ex+ew/2,z.hf?y2+H+54:y2+H);if(!j){lab(ex+ew/2+6,y3-18,'logs via forwarders');bd(1,ex+ew/2-24,y3-14)}});if(z.hf){box(sx,y2+H+24,sw,30,'ten','Heavy forwarders: TLS, routing, filtering','',0,'hf');arrow(sx+sw/2,y2+H+24,sx+sw/2,y2+H)}
  up(sx+sw/2)}
 if(BND){E.push(`<line x1="${P}" y1="${y2+H+18}" x2="${W-P}" y2="${y2+H+18}" stroke="#d1453b" stroke-width="2" stroke-dasharray="8 5"/><text class="h" x="${W-P}" y="${y2+H+14}" text-anchor="end">Client network edge</text>`)}
 lab(P,y3+78,'Reference design only, not an endorsed or validated Splunk architecture. Review against Splunk guidance before use.');lab(P,y3+96,'Splunk MSSP architecture builder v7 · '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
 document.getElementById('out').innerHTML=`<svg viewBox="0 0 ${W} ${y3+106}" role="img" aria-label="Splunk MSSP architecture diagram"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker></defs>${E.join('')}</svg>`}

function notes(z,C){const n=[],sa=z.mwhere==='saas',hasS=!!C,hasD=z.pattern!=='multi';
 const P0={ded:'Dedicated environments: every client has a fully isolated Splunk deployment with its own infrastructure, data and access.',multi:'Multi-client environment: all clients on one shared MSSP-managed platform with segregated data and no direct client access.',hdash:'Hybrid (dashboard access): a shared multi-tenant platform where clients see pre-built dashboards and reports only, alongside dedicated stacks for some clients.',hsearch:'Hybrid (search access): a shared multi-tenant platform where each client gets a dedicated, RBAC-restricted search head limited to their own data, alongside dedicated stacks for some clients.'};
 if(hasS&&!sa){n.push(`Shared platform topology ${C}: the letter is the indexing tier (S single, D distributed, C clustered, M multi-site), the digit is the search tier (1 single, 2 multiple, 3 SHC, 4 stretched SHC), and +10 means dedicated search heads for Enterprise Security.`);
  if(z.es&&C[0]!=='S')n.push('Enterprise Security needs its own search head (or cluster) on distributed topologies, which is why ES and analyst search heads are drawn separately.');
  if(z.avail==='dr'&&z.search!=='stretch')n.push('Multi-site indexing without a stretched SHC: keep a search head per site. Users’ searches and dashboards will not stay in sync between sites.');
  if(z.search==='stretch')n.push('A stretched SHC keeps user artifacts in sync across sites but cannot guarantee every artifact is replicated at all times. It only makes sense with multi-site indexing.');
  if(z.avail==='none')n.push('No HA gives non-clustered indexers (D): an indexer failure loses its unreplicated data and leaves gaps in search results, which is rarely acceptable for security detection.')}
 if(hasS)n.push('Shared platform tenancy: one index set per client, roles limited with srchIndexesAllowed, per-client apps and HEC tokens, and retention set per index. Clients above roughly 100 GB/day belong in their own dedicated stack instead.');
 if(z.pattern==='hdash')n.push('Dashboard-only access: build read-only dashboards or reports per client and keep search capability out of client roles.');
 if(z.pattern==='hsearch')n.push('Per-client search heads add hosts and licences to manage. Restrict each to that client’s indexes with RBAC and size it for that client’s search load.');
 if(hasD)n.push('Dedicated stacks: patching, upgrades, licensing and monitoring repeat per client, so operating cost grows with client count. Strict data custody or isolation rules usually point here, and those designs can fall outside the Validated Architectures.');
 if(z.view!=='itsm')n.push('Mothership runs scheduled SPL on each stack and stores the results locally, and the ES Mothership app rolls up notables across ES instances. Both are listed on Splunkbase as not supported, and each stack needs a service account for it.');
 if(z.view!=='moth')n.push('ITSM view: deduplicate and throttle in each ES before ticketing, map each client to an assignment group and sync status back (for example with the Splunk Add-on for ServiceNow or a webhook).');
 if(z.view==='both')n.push('With both, decide which system is the source of truth for case status and avoid double-ticketing.');
 if(sa&&hasS)n.push('Splunk Cloud Platform: Splunk operates indexing and search. You keep forwarders, heavy forwarders and the Deployment Server.');
 if(hasS&&z.mwhere==='cloud')n.push('Public cloud: use instance types that meet Splunk’s reference hardware with fast local or provisioned-IOPS storage, and map sites to AZs or regions.');
 if(z.virt&&hasS&&!sa)n.push('Virtualised: reserve CPU and RAM (no overcommit), use storage giving roughly 800 or more IOPS for hot and warm, and use anti-affinity so cluster peers sit on different hosts.');
 if(z.hf&&hasS)n.push('Heavy forwarder tier: terminate TLS, route each client’s data to the right indexes, filter or mask before indexing, and run API add-ons here rather than on the indexers.');
 if(z.sC)n.push('Splunk SOAR (central): automates the SOC\u2019s own response (enrichment, triage, case handling). Pair it with the MSP platform\u2019s Enterprise Security, and check the SOAR compatibility matrix first because pairing support differs by SOAR version and deployment type, especially for multi-tenant SOAR.');
 if(z.sD)n.push('Splunk SOAR (client side, beside each dedicated stack’s ES): runs each client\u2019s own response runbooks. Agree who owns the playbooks and stored credentials, and how the SOC triggers them (ticket, API or paired ES). Reaching client assets from a SOAR outside their network usually needs an Automation Broker.');

function steps(z,C){const hasS=z.pattern!=='ded',hasD=z.pattern!=='multi',hy=z.pattern[0]==='h',s=[];
